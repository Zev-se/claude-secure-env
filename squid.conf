# Squid configuration for Claude Code sandbox
# Only allows CONNECT tunnels to api.anthropic.com:443

# Minimal worker config
workers 1

# Log to stdout only (no disk logging)
access_log stdio:/dev/stdout
cache_log stdio:/dev/stderr
cache_store_log none

# No disk cache
cache deny all

# ACL definitions
acl SSL_ports port 443
acl CONNECT method CONNECT

# Allowlisted destinations
acl allowed_dst dstdomain api.anthropic.com

# Deny CONNECT to anything other than port 443
http_access deny CONNECT !SSL_ports

# Allow CONNECT only to the allowlisted domain on 443
http_access allow CONNECT allowed_dst

# Deny everything else
http_access deny all

# Listen on port 3128
http_port 3128

# Minimal memory footprint
maximum_object_size 0 KB
